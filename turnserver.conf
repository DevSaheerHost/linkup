# ===== LinkUp coturn config =====
# Long-term credential mechanism (username/password the app sends)
lt-cred-mech
realm=linkup

# One static user. Change the password, and match it in linkup.html ICE credential.
user=linkup:CHANGE_ME

# Main listening port (clients reach this; must be port-forwarded UDP+TCP)
listening-port=3478

# Relay port range (must be port-forwarded as UDP). Keep it small.
min-port=49160
max-port=49200

# Your PUBLIC IP. If you have a static public IP, hardcode it here:
# external-ip=203.0.113.10
# If your public IP changes, leave the line above commented and pass
# --external-ip at runtime (see coturn-run.sh).

fingerprint
stale-nonce=600
no-multicast-peers
no-cli
# Comment the next line out if you want verbose logs while testing
no-stdout-log
